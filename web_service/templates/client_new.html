{% extends "base.html" %}
{% block title %}Новая карточка клиента{% endblock %}
{% block content %}
<h1>Карточка клиента</h1>
<div class="card">
<form method="post" action="/clients/new">
  <div class="row">
    <div><label>ИНН (10 или 12 цифр) *</label><input name="inn" required pattern="[0-9]{10}|[0-9]{12}"></div>
    <div><label>КПП (9 цифр)</label><input name="kpp" pattern="[0-9]{9}"></div>
  </div>
  <label>Название организации *</label><input name="name" required>
  <label>Юридический адрес *</label><input name="legal_address" required>
  {% if has(user, "manager") %}
  <div class="row">
    <div><label>ID пользователя клиента</label><input name="user_id" type="number"></div>
    <div><label>ID менеджера</label><input name="manager_id" type="number" value="{{ user.id }}"></div>
    <div><label>Кредитный лимит, ₽ (0 — не задан)</label><input name="credit_limit" type="number" step="0.01" min="0" value="0"></div>
  </div>
  {% else %}
  <p class="muted">Кредитный лимит и менеджера назначит сотрудник после проверки карточки.</p>
  {% endif %}
  <p><button type="submit">Создать карточку</button></p>
</form>
</div>
{% endblock %}
